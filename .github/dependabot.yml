# Dependabot revisa cada semana si hay versiones nuevas o con vulnerabilidades.
# Los rev de .pre-commit-config.yaml se
# actualizan a mano con: pre-commit autoupdate --freeze
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      # Un solo PR semanal con las versiones menores y parches (seguras). Las versiones
      # mayores (ej. ESLint 9 -> 10) llegan en PRs separados para revisarlas una por una.
      # Las actualizaciones de seguridad siempre llegan, sin importar el tipo.
      menores:
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /recolector
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      menores:
        update-types:
          - minor
          - patch
