# Dependabot revisa cada semana si hay versiones nuevas o con vulnerabilidades.
# npm del frontend se agrega en la fase 3. Los rev de .pre-commit-config.yaml se
# actualizan a mano con: pre-commit autoupdate --freeze
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: pip
    directory: /recolector
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
