# Dependabot revisa cada semana si hay versiones nuevas o con vulnerabilidades.
# Los rev de .pre-commit-config.yaml se
# actualizan a mano con: pre-commit autoupdate --freeze
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      # Un solo PR semanal para las dependencias de desarrollo (tests, lint, build).
      desarrollo:
        dependency-type: development

  - package-ecosystem: pip
    directory: /recolector
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
