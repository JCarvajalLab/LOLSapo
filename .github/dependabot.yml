# Dependabot revisa cada mes si hay versiones nuevas o con vulnerabilidades.
# Los rev de .pre-commit-config.yaml se
# actualizan a mano con: pre-commit autoupdate --freeze
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    # Esperar unos días antes de proponer una versión recién publicada: los paquetes
    # comprometidos suelen detectarse en ese plazo. No afecta a las de seguridad.
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
    groups:
      # Un solo PR mensual con las versiones menores y parches (seguras). Las versiones
      # mayores (ej. ESLint 9 -> 10) llegan en PRs separados para revisarlas una por una.
      # Las actualizaciones de seguridad siempre llegan, sin importar el tipo.
      menores:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /disparador
    schedule:
      interval: monthly
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
    groups:
      menores:
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /recolector
    schedule:
      interval: monthly
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
    groups:
      menores:
        update-types:
          - minor
          - patch
