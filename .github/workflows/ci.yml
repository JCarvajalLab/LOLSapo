name: CI

on:
  push:
    branches: [main]
  pull_request:

# Permisos mínimos: el workflow solo puede leer el repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seguridad:
    name: Chequeos de seguridad y formato
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # historial completo para que gitleaks revise todos los commits
          persist-credentials: false

      - name: gitleaks (todo el historial)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --verbose --config .gitleaks.toml

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Instalar herramientas
        run: pip install -r requirements-dev.txt

      # gitleaks ya corrió arriba sobre todo el historial.
      - name: pre-commit (formato y archivos)
        env:
          SKIP: gitleaks
        run: pre-commit run --all-files --show-diff-on-failure

  # Fase 2: aquí se agrega el job de Python (pytest, Bandit, pip-audit).
  # Fase 3: aquí se agrega el job del frontend (Vitest, ESLint, npm audit).
